name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict build (-Wall -Wextra -Werror) with ASan/UBSan, run tests
        run: sh scripts/build.sh test
      - name: Independent expectations still match the committed fixtures
        run: python3 scripts/derive_expected.py | diff - fixtures/expected.tsv
      - name: Regenerate results and compare with committed artifacts
        run: |
          sh scripts/build.sh results /tmp/results
          diff -r results /tmp/results
          cd results && sha256sum -c SHA256SUMS
